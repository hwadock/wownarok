    <script>
      let canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var roGet = function (f) { try { var x = new XMLHttpRequest(); x.open("GET", f + "?t=" + Date.now(), false); x.send(); return x.status == 200 ? x.responseText.trim() : ""; } catch (e) { return ""; } };
      var roCode = "cd52d9cfxabc42f7c";   // 처음엔 이 입구에 박힌 판 — 실제 판은 아래 tryStart 가 서버 PC 입구(대체 Pages)에서 읽어 바꾼다
      var roCdn = roGet("cdn.txt").replace(/\/+$/, ""); if (!/^https?:\/\/[^\s\/"'<>]+(\/[^\s"'<>]*)?$/.test(roCdn)) roCdn = "";
      var buildUrl = "b_" + roCode;
      // 휴대폰판 고르기(2026-11-12 사용자 결정 '그래픽 능력 검사') — DXT(s3tc)를 못 쓰고 ASTC 를 쓰는 기기는 ASTC 판:
      //   안드로이드 = v_<판>_a(ASTC·원래 크기, 2026-11-12 사용자 결정), 그 밖(아이폰 등) = v_<판>_m(ASTC·그림 절반).
      //   ?tex=dxt / ?tex=astc(아이폰판) / ?tex=astca(안드로이드판) 로 강제. 검사용 캔버스 문맥은 바로 버린다(lose_context).
      //   판이 없으면(404) 아래 tryHost 가 _a → _m → 일반판 순으로 내려간다.
      var roVariant = (function () {
        var q = /[?&]tex=(dxt|astca|astc)(&|$)/.exec(location.search);
        if (q) return q[1] == "astca" ? "_a" : q[1] == "astc" ? "_m" : "";
        try {
          var c = document.createElement("canvas"), g = c.getContext("webgl2") || c.getContext("webgl");
          if (!g) return "";
          var s3 = g.getExtension("WEBGL_compressed_texture_s3tc") || g.getExtension("WEBKIT_WEBGL_compressed_texture_s3tc");
          var astc = g.getExtension("WEBGL_compressed_texture_astc");
          var lose = g.getExtension("WEBGL_lose_context"); if (lose) lose.loseContext();
          return !s3 && astc ? (/Android/i.test(navigator.userAgent) ? "_a" : "_m") : "";
        } catch (e) { return ""; }
      })();
      window.roVariant = roVariant;
      // 웹 파일을 못 받을 때(통로 530·끊김) 알림창 대신 점검 화면처럼 '다시 잡는 중' 판을 띄우고 30초마다 다시 시도(2026-11-10 사용자 "문제가 있다면 점검 페이지라도")
      var roWait = (function () {
        var el = null, tm = null, left = 0, again = null, sub = null;
        return function (why, retry) {
          again = retry;
          if (!el) {
            el = document.createElement("div");
            el.style.cssText = "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(20,14,10,.94);font-family:sans-serif;word-break:keep-all;overflow-wrap:anywhere";
            el.innerHTML = '<div style="max-width:420px;margin:24px;padding:28px 24px;border:2px solid #C9963F;border-radius:14px;background:#2E2018;color:#EBDDBC;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)">'
              + '<div style="font-size:20px;font-weight:bold;color:#FFD966;margin-bottom:10px">서버 연결을 다시 잡는 중입니다</div>'
              + '<div data-ro="sub" style="font-size:15px;line-height:1.5;margin-bottom:18px"></div>'
              + '<button data-ro="btn" style="font-size:15px;font-weight:bold;padding:10px 22px;border:0;border-radius:10px;background:#C9963F;color:#2E2018;box-shadow:0 4px 0 #7a5a24;cursor:pointer">지금 다시 시도</button></div>';
            document.body.appendChild(el);
            sub = el.querySelector('[data-ro="sub"]');
            el.querySelector('[data-ro="btn"]').onclick = function () { left = 0; tick(); };
          }
          el.style.display = "flex";
          left = 30;
          if (why) console.warn("[RO] " + why);
          var tick = function () {
            if (tm) clearTimeout(tm);
            if (left <= 0) { sub.textContent = "다시 연결하는 중…"; var f = again; again = null; if (f) f(); return; }
            sub.textContent = "잠시만 기다려 주세요. " + left + "초 뒤에 저절로 다시 시도합니다.";
            left--; tm = setTimeout(tick, 1000);
          };
          tick();
        };
      })();
      var roWaitHide = function () { var e = document.querySelector('[data-ro="sub"]'); if (e) e.parentNode.parentNode.style.display = "none"; };
      // 고정 주소(cdn.wownarok.com, 이름 있는 터널)에서 지금 웹 파일 통로 주소 — 서버 PC 가 터널을 다시 켜면 몇 초 안에 바뀐다(2026-11-10, webhost.py /addr.json).
      //   Pages cdn.txt 반영(1~2분)을 기다리는 동안 그 주소가 죽어 있으면 이걸로 바로 붙는다. 3초 안에 못 받으면 "".
      var roAddr = function (cb) {
        var fin = function (v) { if (cb) { var f = cb; cb = null; f(v); } };
        setTimeout(function () { fin(""); }, 3000);
        try { fetch("https://cdn.wownarok.com/addr.json?t=" + Date.now(), { cache: "no-store", mode: "cors" }).then(function (r) { return r.ok ? r.json() : {}; }).then(function (j) { var c = j && typeof j.cdn == "string" ? j.cdn.replace(/\/+$/, "") : ""; fin(/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(c) ? c : ""); }, function () { fin(""); }); } catch (e) { fin(""); }
      };
      // 서버 PC 입구의 판 번호(<주소>/entry/version.txt, no-store) — 비동기, ms 안에 못 받으면 "". 404(서버 PC 에 파일 없음)면 null.
      var roEntry = function (base, ms, cb) {
        var ctl = window.AbortController ? new AbortController() : null;
        var fin = function (v) { if (cb) { var f = cb; cb = null; if (ctl && v === "") ctl.abort(); f(v); } };
        setTimeout(function () { fin(""); }, ms);
        try { fetch(base + "/entry/version.txt?t=" + Date.now(), { cache: "no-store", mode: "cors", signal: ctl ? ctl.signal : undefined }).then(function (r) { if (r.status == 404) { fin(null); return; } if (!r.ok) { fin(""); return; } return r.text().then(function (t) { t = t.trim(); fin(/^[0-9a-zA-Z]{4,40}$/.test(t) ? t : ""); }); }).then(null, function () { fin(""); }); } catch (e) { fin(""); }
      };
      // 판 번호 고르기 = 빠른 터널 입구(3초) → 고정 주소 입구(4초) → Pages version.txt(동기, 마지막 대체). cb 에 받은 글(못 받으면 "")
      var roFixed = "https://cdn.wownarok.com";
      var roVer = function (cb) {
        var pages = function () { cb(roGet("version.txt")); };
        var fixed = function () { roEntry(roFixed, 4000, function (v) { if (v) cb(v); else pages(); }); };
        if (!roCdn || roCdn == roFixed) { fixed(); return; }
        roEntry(roCdn, 3000, function (v) { if (v) cb(v); else if (v === null) pages(); else fixed(); });
      };
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        cacheControl: function (url) { if (/_[0-9a-f]{32}\.bundle$/.test(url)) return "immutable"; if (/\.data|\.bundle/.test(url)) return "must-revalidate"; return "no-store"; },
        webglContextAttributes: { alpha: false, preserveDrawingBuffer: false, powerPreference: 2 },

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DefaultCompany",
        productName: "RO",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with

      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes' + (navigator.standalone ? ', viewport-fit=cover' : '');
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        var roFitDesktop = function () {
          var s = Math.min(window.innerWidth / 540, (window.innerHeight - 40) / 960);
          if (document.fullscreenElement) s = Math.min(window.innerWidth / 540, window.innerHeight / 960);
          fullscreenContainer.style.width = Math.floor(540 * s) + "px";
          fullscreenContainer.style.height = Math.floor(960 * s) + "px";
        };
        roFitDesktop();
        window.addEventListener("resize", roFitDesktop);
        document.addEventListener("fullscreenchange", roFitDesktop);
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            if (!loadingContainer.__roWait) { loadingContainer.__roWait = 1; var roT0 = Date.now(), roGI = Storage.prototype.getItem, roHook = function (k) { var v = roGI.apply(this, arguments); if (k === "ro_login_keep" && v) roDone(); return v; }, roDone = function () { loadingContainer.style.display = "none"; clearInterval(roIv); try { if (Storage.prototype.getItem === roHook) Storage.prototype.getItem = roGI; } catch (e) {} }, roIv = setInterval(function () { if (document.getElementById("ro-entry-overlay") || document.getElementById("ro-prologue") || window.__roInWorld || Date.now() - roT0 > 30000) roDone(); }, 100); try { Storage.prototype.getItem = roHook; } catch (e) {} }
          }
        }).then((unityInstance) => { window.__roUnityReady = 1;
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                roWait("게임을 시작하지 못했습니다: " + message, function () { location.reload(); });
              });
            };

      script.onerror = function () { roWait("게임 파일(" + script.src + ")을 받지 못했습니다", function () { location.reload(); }); };
      (function () {
        var go = function () { roWaitHide(); document.body.appendChild(script); };
        var applied = false, first = true;
        // 처음 읽은 판이 이 입구에 박힌 판과 다르면 그 판으로 바꾼다(Pages 입구 껍데기가 옛것으로 캐시돼 있어도 새 판을 받게) — Pages b_<판> 대체 경로도 같이
        var roUseCode = function (c) {
          var nb = "b_" + c;
          ["dataUrl", "frameworkUrl", "codeUrl", "symbolsUrl"].forEach(function (k) { if (typeof config[k] == "string" && config[k].indexOf(buildUrl + "/") == 0) config[k] = nb + config[k].substring(buildUrl.length); });
          if (loaderUrl.indexOf(buildUrl + "/") == 0) { loaderUrl = nb + loaderUrl.substring(buildUrl.length); script.src = loaderUrl; }
          buildUrl = nb; roCode = c;
        };
        var tryStart = function (override) {
          // 다시 시도할 때마다 서버 PC 가 올린 최신 주소·판을 다시 읽는다(통로를 다시 켜면 주소가 바뀐다). 첫 시도의 cdn.txt 는 위에서 막 읽었다
          var wasFirst = first; first = false;
          if (override) roCdn = override;
          else if (!wasFirst) { var c = roGet("cdn.txt").replace(/\/+$/, ""); if (/^https?:\/\/[^\s\/"'<>]+(\/[^\s"'<>]*)?$/.test(c)) roCdn = c; }
          roVer(function (v) {
            if (/^[0-9a-zA-Z]{4,40}$/.test(v) && v != roCode) {
              if (wasFirst && !applied) roUseCode(v);
              else { location.reload(); return; }   // 그사이 새 판이 올라옴 — 새 입구로
            }
            tryHost(override);
          });
        };
        var tryHost = function (override) {
          if (!roCdn) { go(); return; }
          var base = roCdn + "/v_" + roCode + roVariant + "/", done = false;
          var ctl = window.AbortController ? new AbortController() : null;
          var finish = function (ok, status) {
            if (done) return;
            done = true;
            if (!ok && status == 404 && roVariant) {   // 이 판엔 그 판이 없다(옛 판·굽기 실패) — 안드로이드판이면 휴대폰판(_m), 그다음 일반판으로
              console.warn("[RO] " + (roVariant == "_a" ? "안드로이드판" : "휴대폰판") + "(" + base + ")이 없어 " + (roVariant == "_a" ? "휴대폰판" : "일반판") + "으로 받습니다.");
              roVariant = roVariant == "_a" ? "_m" : ""; window.roVariant = roVariant;
              tryHost(override);
              return;
            }
            if (ok) {
              if (!applied) {
                applied = true;
                ["dataUrl", "frameworkUrl", "codeUrl", "symbolsUrl"].forEach(function (k) { if (typeof config[k] == "string" && config[k].indexOf(buildUrl + "/") == 0) config[k] = base + "Build" + config[k].substring(buildUrl.length); });
                buildUrl = base + "Build";
              }
              loaderUrl = base + "Build/WebGL.loader.js";
              config.streamingAssetsUrl = base + "StreamingAssets";
              script.src = loaderUrl;
              go();
              return;
            }
            if (ctl) ctl.abort();
            // 웹 파일 서버를 못 찾음 — 먼저 고정 주소에 지금 주소를 묻고, 다르면 바로 그 주소로 다시
            if (!override) {
              roAddr(function (ac) {
                if (ac && ac != roCdn) { console.warn("[RO] cdn.txt 주소(" + roCdn + ")가 죽어 있어 고정 주소가 알려 준 " + ac + " 로 다시 시도합니다."); tryStart(ac); }
                else fallback();
              });
              return;
            }
            fallback();
          };
          var fallback = function () {
            // Pages 에 이 판(-PagesBuild)이 있으면 그쪽, 없으면 기다렸다 다시
            var pages = buildUrl + "/WebGL.loader.js";
            var pagesOk = function (ok2) {
              if (ok2) { console.warn("[RO] 웹 파일 서버(" + base + ")를 확인하지 못해 Pages 판으로 받습니다."); go(); }
              else roWait("웹 파일 서버(" + base + ")에 연결하지 못했습니다", tryStart);
            };
            if (applied) { pagesOk(false); return; }
            try { fetch(pages, { method: "HEAD", cache: "no-store" }).then(function (r) { pagesOk(r.ok); }, function () { pagesOk(false); }); } catch (e) { pagesOk(false); }
          };
          setTimeout(function () { finish(false); }, 6000);
          try { fetch(base + "Build/WebGL.loader.js", { method: "HEAD", cache: "no-store", mode: "cors", signal: ctl ? ctl.signal : undefined }).then(function (r) { finish(r.ok, r.status); }, function () { finish(false); }); } catch (e) { finish(false); }
